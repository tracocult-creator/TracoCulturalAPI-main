spring.application.name=TracoCultural
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:sqlserver://TracoCulturalDB.mssql.somee.com;databaseName=TracoCulturalDB;integratedSecurity=false;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:migskADM}
spring.datasource.password=${DB_PASSWORD:22102008@Mm}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Pool de conexão (Hikari) — a Somee derruba conexões ociosas rápido,
# então fechamos e validamos antes dela, pra não pegar conexão morta.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT 
jwt.secret=${JWT_SECRET:your_secret_key_here_minimum_256_bits_long_for_security_requirements_should_be_very_long}

